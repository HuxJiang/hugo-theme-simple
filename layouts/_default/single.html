{{ define "main" }}
<article>
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
  </header>
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ with .TableOfContents }}
<aside class="toc">
  <div class="toc-title">目录</div>
  {{ . }}
</aside>
{{ end }}
{{ end }}
